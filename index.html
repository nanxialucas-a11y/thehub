<!DOCTYPE html>
<html>
<head>
    <title>the hub entrance</title>
    <link rel="icon" href="favicon.ico?v=3">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            background: #09090b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.2);
        }

        h1 {
            font-size: 48px;
            margin: 0;
            letter-spacing: 2px;
            color: #8b5cf6;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
        }

        p {
            margin-top: 10px;
            color: #cccccc;
            font-size: 18px;
        }

        button {
            margin-top: 25px;
            padding: 10px 18px;
            border: 1px solid #8b5cf6;
            border-radius: 8px;
            background: transparent;
            color: #8b5cf6;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            background: #8b5cf6;
            color: #09090b;
            transform: scale(1.05);
            box-shadow: 0 0 15px #8b5cf6;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>welcome to the hub's entrance</h1>
        <p><em>currently under alpha, first stable version will be available sometime in the next month<em></p>
        <p>a small website i created which currently features many unblocked games, a built-in (but unstable) proxy and many free animes
        <button onclick="window.location.href='home.html'">enter</button>
    </div>
</body>
</html>
